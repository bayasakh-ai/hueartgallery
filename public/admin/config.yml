# Use DecapBridge classic auth (required)
backend:
  name: git-gateway
  repo: bayasakh-ai/hueartgallery
  branch: main
  identity_url: https://auth.decapbridge.com/sites/cc757d21-403f-4302-9d7b-3c7638a2de0a
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# When the admin is opened on localhost with `npx decap-server` running, it
# edits the files on this computer instead (for testing). Ignored online.
local_backend: true

# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Add site links in Decap CMS (optional)
site_url: https://hueartgallery.bayasakhenkhtsetseg.workers.dev

# The site is built with Vite, so uploaded images live in public/.
# media_folder = where uploaded images are saved in the repo,
# public_folder = the web address they are served from.
media_folder: "public/images"
public_folder: "/images"

# Hide the live preview pane: the form gets the whole width.
editor:
  preview: false

# Every text can be written in English and Mongolian. Each item is one file:
# { "en": {...}, "mn": {...} }. Fields marked `i18n: true` have a box per
# language; the rest (photos, prices, dates) are filled in once.
# If one language is left empty the site shows the other one.
i18n:
  structure: single_file
  locales: [en, mn]
  default_locale: en

# How each item's file looks, and what makes its web address.
# (The site combines these files - see vite.config.ts.)
collections:
  # ---------------------------------------------------------------- Paintings
  - name: "paintings"
    label: "Paintings / Уран зураг"
    label_singular: "Painting / Уран зураг"
    description: "Click a painting to edit it, or “New Painting” to add one."
    folder: "content/paintings"
    format: "json"
    extension: "json"
    create: true
    i18n: true
    slug: "{{title}}"
    identifier_field: "title"
    summary: "{{title}}"
    sortable_fields: ["title", "status"]
    fields:
      - {label: "Main photo / Үндсэн зураг", name: "image", widget: "image"}
      - label: "More photos / Нэмэлт зургууд"
        name: "photos"
        widget: "list"
        required: false
        collapsed: false
        hint: "Optional: close-ups, the frame, the back... Visitors can browse them all on the painting's page."
        field: {label: "Photo / Зураг", name: "photo", widget: "image"}
      - {label: "Title / Нэр", name: "title", widget: "string", i18n: true}
      - label: "Artist / Уран бүтээлч"
        name: "painter"
        widget: "relation"
        collection: "artists"
        search_fields: ["name"]
        value_field: "{{slug}}"
        display_fields: ["name"]
        required: false
        hint: "Add the artist under Artists first, then pick them here."
      - label: "Status / Төлөв"
        name: "status"
        widget: "select"
        default: "available"
        options:
          - {label: "For sale / Худалдаанд", value: "available"}
          - {label: "Reserved / Захиалгатай", value: "reserved"}
          - {label: "Sold / Зарагдсан", value: "sold"}
      - {label: "Price ₮ / Үнэ ₮", name: "price", widget: "number", value_type: "int", min: 0, required: false, hint: "Numbers only, e.g. 2500000. Leave empty to show “Price on request”."}
      - {label: "Description / Тайлбар", name: "description", widget: "text", required: false, i18n: true}
      # Numbers are the same in both languages, so this group is only on the English side.
      - label: "Size & year / Хэмжээ, он"
        name: "size"
        widget: "object"
        collapsed: true
        required: false
        fields:
          - {label: "Year / Он", name: "year", widget: "number", value_type: "int", min: 1800, max: 2100, required: false}
          - {label: "Width cm / Өргөн", name: "width_cm", widget: "number", value_type: "int", min: 1, required: false}
          - {label: "Height cm / Өндөр", name: "height_cm", widget: "number", value_type: "int", min: 1, required: false}
      - label: "More details / Нэмэлт мэдээлэл"
        name: "details"
        widget: "object"
        collapsed: true
        required: false
        i18n: true
        fields:
          - {label: "Medium / Материал", name: "medium", widget: "string", required: false, hint: "e.g. Oil on canvas", i18n: true}
          - {label: "Frame / Хүрээ", name: "frame", widget: "string", required: false, i18n: true}
          - {label: "Signature / Гарын үсэг", name: "signature", widget: "string", required: false, i18n: true}
          - {label: "Authenticity / Жинхэнэ эсэх", name: "authenticity", widget: "string", required: false, i18n: true}

  # ------------------------------------------------------------------ Artists
  - name: "artists"
    label: "Artists / Уран бүтээлчид"
    label_singular: "Artist / Уран бүтээлч"
    description: "Click an artist to edit, or “New Artist” to add one."
    folder: "content/artists"
    format: "json"
    extension: "json"
    create: true
    i18n: true
    slug: "{{name}}"
    identifier_field: "name"
    summary: "{{name}}"
    fields:
      - {label: "Photo / Зураг", name: "photo", widget: "image", required: false, hint: "Optional. If empty, one of their paintings is shown instead."}
      - {label: "Name / Нэр", name: "name", widget: "string", i18n: true}
      - {label: "Style / Хэв маяг", name: "style", widget: "string", required: false, hint: "Short, e.g. Abstract expressionism", i18n: true}
      - {label: "Biography / Намтар", name: "bio", widget: "text", required: false, i18n: true}
      - label: "More details / Нэмэлт мэдээлэл"
        name: "details"
        widget: "object"
        collapsed: true
        required: false
        i18n: true
        fields:
          - {label: "Artist statement / Уран бүтээлчийн үг", name: "statement", widget: "text", required: false, i18n: true}
          - {label: "Education / Боловсрол", name: "education", widget: "text", required: false, i18n: true}
          - {label: "Awards / Шагнал", name: "awards", widget: "list", required: false, i18n: true, field: {label: "Award / Шагнал", name: "award", widget: "string"}}

  # -------------------------------------------------------------- Exhibitions
  - name: "exhibitions"
    label: "Exhibitions / Үзэсгэлэн"
    label_singular: "Exhibition / Үзэсгэлэн"
    description: "Click an exhibition to edit, or “New Exhibition” to add one."
    folder: "content/exhibitions"
    format: "json"
    extension: "json"
    create: true
    i18n: true
    slug: "{{title}}"
    identifier_field: "title"
    summary: "{{title}}"
    fields:
      - {label: "Cover photo / Нүүр зураг", name: "cover", widget: "image", required: false}
      - {label: "Title / Нэр", name: "title", widget: "string", i18n: true}
      - {label: "Start date / Эхлэх огноо", name: "start_date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", picker_utc: true}
      - {label: "End date / Дуусах огноо", name: "end_date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", picker_utc: true, hint: "The site shows Upcoming / On now / Ended by itself from these dates."}
      - {label: "Location / Байршил", name: "location", widget: "string", required: false, i18n: true}
      - {label: "Description / Тайлбар", name: "description", widget: "text", required: false, i18n: true}
      - label: "Photos / Зургууд"
        name: "gallery_images"
        widget: "list"
        required: false
        field: {label: "Photo / Зураг", name: "photo", widget: "image"}
      - label: "More details / Нэмэлт мэдээлэл"
        name: "details"
        widget: "object"
        collapsed: true
        required: false
        fields:
          - {label: "Video / Бичлэг", name: "video", widget: "file", required: false, hint: "Optional. An .mp4 file (keep it small) or a direct link to one."}
          - label: "Artists / Уран бүтээлчид"
            name: "painters"
            widget: "relation"
            collection: "artists"
            search_fields: ["name"]
            value_field: "{{slug}}"
            display_fields: ["name"]
            multiple: true
            required: false
          - label: "Paintings on show / Дэлгэгдэх бүтээлүүд"
            name: "paintings"
            widget: "relation"
            collection: "paintings"
            search_fields: ["title"]
            value_field: "{{slug}}"
            display_fields: ["title"]
            multiple: true
            required: false

  # ------------------------------------------------------------ Site settings
  - name: "site"
    label: "Site Settings / Тохиргоо"
    i18n: true
    files:
      - name: "site"
        label: "Gallery Info & Text / Галерейн мэдээлэл"
        file: "content/site.json"
        format: "json"
        i18n: true
        fields:
          - {label: "Gallery name / Нэр", name: "name", widget: "string", i18n: true}
          - {label: "Tagline / Уриа", name: "tagline", widget: "string", required: false, i18n: true}
          - {label: "Footer line / Хөлийн бичиг", name: "footer_text", widget: "string", required: false, i18n: true}
          - {label: "Home page heading / Нүүр хуудасны гарчиг", name: "home_title", widget: "string", required: false, i18n: true}
          - {label: "Home page text / Нүүр хуудасны текст", name: "home_text", widget: "text", required: false, hint: "Leave a blank line between paragraphs.", i18n: true}
          - {label: "Home page picture / Нүүр хуудасны зураг", name: "home_image", widget: "image", required: false, hint: "Shown next to the welcome text. Add more below to make it a slider."}
          - label: "More home page pictures / Нүүр хуудасны нэмэлт зургууд"
            name: "home_photos"
            widget: "list"
            required: false
            collapsed: false
            hint: "Optional. These play as a slider together with the picture above."
            field: {label: "Picture / Зураг", name: "photo", widget: "image"}
          - {label: "About page intro / Бидний тухай - оршил", name: "about_description", widget: "text", required: false, i18n: true}
          - {label: "About page heading / Бидний тухай - гарчиг", name: "about_title", widget: "string", required: false, i18n: true}
          - {label: "About page story / Бидний тухай - түүх", name: "about_text", widget: "text", required: false, hint: "Leave a blank line between paragraphs. The section is hidden if empty.", i18n: true}
          - {label: "About page picture / Бидний тухай - зураг", name: "about_image", widget: "image", required: false}
          - label: "About page blocks (mission, vision, ...) / Эрхэм зорилго, алсын хараа"
            name: "values"
            widget: "list"
            required: false
            i18n: true
            summary: "{{title}}"
            fields:
              - {label: "Small label / Жижиг гарчиг", name: "label", widget: "string", required: false, hint: "e.g. Mission"}
              - {label: "Heading / Гарчиг", name: "title", widget: "string"}
              - {label: "Text / Текст", name: "text", widget: "text", required: false}
          - {label: "Address / Хаяг", name: "address", widget: "text", required: false, hint: "One line per row.", i18n: true}
          - {label: "Email / Имэйл", name: "email", widget: "string", required: false}
          - {label: "Phone / Утас", name: "phone", widget: "string", required: false}
          - {label: "Opening hours / Цагийн хуваарь", name: "hours", widget: "text", required: false, hint: "One line per row, e.g. Tue - Sat, 10:00 - 18:00", i18n: true}
          - {label: "Opening hours note / Цагийн тэмдэглэл", name: "hours_note", widget: "string", required: false, hint: "e.g. Sunday and Monday by appointment", i18n: true}
          - {label: "Instagram link", name: "instagram", widget: "string", required: false}
          - {label: "Facebook link", name: "facebook", widget: "string", required: false}
