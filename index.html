<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hue Art Gallery</title>
    <meta name="description" content="Hue Art Gallery: paintings, painters and exhibitions." />
    <meta property="og:title" content="Hue Art Gallery" />
    <meta property="og:description" content="Paintings, painters and exhibitions." />
    <meta property="og:image" content="https://hueartgallery.netlify.app/images/header_logo.png" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>

    <!--
      Contact form registration for Netlify Forms. Netlify reads this at deploy
      time; the React contact form (AboutPage) posts to it. Do not remove.
    -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <input type="text" name="painting" />
      <input type="text" name="bot-field" />
    </form>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
